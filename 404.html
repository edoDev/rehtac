<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not found — Rehtac AI</title>
  <style>
    :root { --bg:#03050c; --text:#e8eef8; --muted:#8a9bb8; --accent:#00c8e0; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100vh; background:var(--bg); color:var(--text);
      font-family:'Segoe UI', system-ui, sans-serif;
      display:flex; align-items:center; justify-content:center; padding:32px;
    }
    main { max-width:440px; text-align:center; }
    .logo { letter-spacing:3px; text-transform:uppercase; color:var(--accent); font-size:13px; font-weight:600; margin-bottom:20px; }
    h1 { font-size:1.8rem; font-weight:600; margin-bottom:12px; }
    p { color:var(--muted); margin-bottom:28px; }
    a {
      color:#03050c; background:#00d4f0; text-decoration:none;
      padding:12px 22px; border-radius:8px; font-size:14px; font-weight:500;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">Rehtac AI</div>
    <h1>Page not found</h1>
    <p>That URL is not on this site.</p>
    <a href="./">Back to Rehtac</a>
  </main>
</body>
</html>
